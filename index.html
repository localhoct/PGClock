<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>اشتراک</title>
  <style>
    @font-face {
      font-family: "Vazirmatn";
      src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2") format("woff2 supports variations"),
           url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2") format("woff2-variations");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
    }

    :root {
      --r-xl: 28px;
      --r-lg: 20px;
      --r-pill: 999px;
      --blur: 64px;
      --glass-bg: rgba(12, 12, 12, 0.82);
      --glass-bg-elevated: rgba(22, 22, 22, 0.92);
      --glass-tint: rgba(0, 0, 0, 0.58);
      --glass-stroke: rgba(255, 106, 0, 0.24);
      --glass-stroke-soft: rgba(255, 255, 255, 0.08);
      --specular: rgba(255, 255, 255, 0.16);
      --text: #fff;
      --text-secondary: rgba(255, 255, 255, 0.62);
      --text-tertiary: rgba(255, 255, 255, 0.42);
      --fill: rgba(255, 255, 255, 0.055);
      --fill-thick: rgba(255, 106, 0, 0.14);
      --blue: #ff6a00;
      --green: #37e66f;
      --orange: #ff9f0a;
      --tap: 48px;
      --shadow: 0 20px 56px rgba(0, 0, 0, 0.78);
      --pad-x: 24px;
      --pad-y: 24px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Vazirmatn", "Segoe UI", Tahoma, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: #000;
      padding: max(34px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: #000;
    }
    .ambient .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.42;
      animation: float 20s ease-in-out infinite alternate;
    }
    .ambient .o1 { width: 85vmin; height: 85vmin; top: -25%; right: -30%; background: #ff5f00; }
    .ambient .o2 { width: 70vmin; height: 70vmin; bottom: 10%; left: -35%; background: #1c1c1e; animation-delay: -8s; }
    .ambient .o3 { width: 50vmin; height: 50vmin; top: 40%; left: 20%; background: #ff9500; opacity: 0.22; animation-delay: -4s; }
    @keyframes float { to { transform: translate(4%, 6%) scale(1.08); } }

    .page { max-width: 440px; margin: 0 auto; }

    .glass {
      position: relative;
      background:
        linear-gradient(165deg, rgba(255,255,255,0.075) 0%, transparent 48%),
        linear-gradient(180deg, rgba(255,255,255,0.035), transparent 70%),
        var(--glass-bg),
        var(--glass-tint);
      backdrop-filter: blur(var(--blur)) saturate(180%) brightness(0.9);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%) brightness(0.9);
      border-radius: var(--r-xl);
      border: 0.5px solid var(--glass-stroke);
      box-shadow:
        var(--shadow),
        inset 0 1px 0 var(--specular),
        inset 0 -1px 0 rgba(255,255,255,0.04);
      overflow: hidden;
    }
    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(145deg, rgba(255,255,255,0.1) 0%, transparent 38%);
      pointer-events: none;
    }

    .login-sheet { padding: var(--pad-y) var(--pad-x); }
    .login-sheet h1 {
      margin: 0 0 20px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
      padding-right: 4px;
    }
    .field {
      width: 100%;
      min-height: var(--tap);
      padding: 14px 16px;
      margin-bottom: 14px;
      border: none;
      border-radius: var(--r-lg);
      background: var(--fill);
      color: var(--text);
      font-size: 17px;
      direction: ltr;
      text-align: left;
      outline: none;
      transition: box-shadow 0.2s, background 0.2s;
    }
    .field:focus {
      background: var(--fill-thick);
      box-shadow: 0 0 0 4px rgba(255, 106, 0, 0.35);
    }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      margin-top: 6px;
      border: none;
      border-radius: var(--r-pill);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 8px 28px rgba(255, 106, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.25);
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s;
    }
    .btn-primary:active { transform: scale(0.97); filter: brightness(0.92); }

    .banner-error {
      margin-bottom: 12px;
      padding: 14px 16px;
      border-radius: var(--r-lg);
      font-size: 15px;
      line-height: 1.4;
      background: rgba(255, 69, 58, 0.18);
      border: 0.5px solid rgba(255, 69, 58, 0.45);
      color: #ffb4b0;
    }

    #main {
      display: none;
      opacity: 0;
    }
    #main.visible {
      display: block;
      animation: main-in 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes main-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-loading {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
      background: rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(10px) saturate(145%);
      -webkit-backdrop-filter: blur(10px) saturate(145%);
      pointer-events: none;
    }
    .loading-text {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .profile {
      padding: 0;
      margin-bottom: 12px;
    }
    .account-card {
      position: relative;
      z-index: 1;
      padding: var(--pad-y) var(--pad-x);
    }
    .account-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .account-identity {
      flex: 1;
      min-width: 0;
    }
    .account-eyebrow {
      display: block;
      margin-bottom: 5px;
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 700;
    }
    .account-name-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }
    .account-name {
      margin: 0;
      min-width: 0;
      color: #fff;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.25;
      direction: ltr;
      text-align: right;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 12px;
      border-radius: var(--r-pill);
      font-size: 13px;
      font-weight: 600;
      background: rgba(48, 209, 88, 0.22);
      color: #86efac;
      border: 0.5px solid rgba(48, 209, 88, 0.4);
      flex-shrink: 0;
    }
    .status-pill.expired, .status-pill.limited { background: rgba(255, 159, 10, 0.2); color: #fcd34d; border-color: rgba(255, 159, 10, 0.4); }
    .status-pill.disabled { background: var(--fill); color: var(--text-secondary); border-color: var(--glass-stroke-soft); }
    .status-pill.on_hold { background: rgba(191, 90, 242, 0.22); color: #e9d5ff; border-color: rgba(191, 90, 242, 0.4); }

    .account-subline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .account-total {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 700;
      direction: rtl;
    }
    .account-total strong {
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      direction: rtl;
      unicode-bidi: isolate;
      white-space: nowrap;
    }
    .account-usage-block {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 0.5px solid rgba(255,255,255,0.08);
    }
    .account-usage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
    }
    .account-usage-percent {
      color: #ffad5c;
      font-size: 15px;
      font-weight: 900;
      direction: ltr;
    }
    .account-progress {
      position: relative;
      height: 12px;
      overflow: hidden;
      border-radius: var(--r-pill);
      background: rgba(255,255,255,0.07);
      border: 0.5px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.7);
    }
    .account-progress-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff4d00, #ff7900 55%, #ffb15c);
      box-shadow: 0 0 12px rgba(255,106,0,0.72);
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .account-progress.unlimited .account-progress-fill {
      width: 100% !important;
      opacity: 0.45;
      background: repeating-linear-gradient(115deg, #ff5f00 0 12px, #ff9f0a 12px 24px);
    }
    .account-volume-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 12px;
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 700;
    }
    .account-remaining {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 7px;
      min-width: 0;
    }
    .account-remaining-label {
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 700;
    }
    .account-remaining strong {
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.4;
      direction: rtl;
      unicode-bidi: isolate;
      white-space: nowrap;
    }
    .account-used {
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 400;
      white-space: nowrap;
      direction: rtl;
      unicode-bidi: isolate;
    }
    .account-meta-row {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 0;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 0.5px solid rgba(255,255,255,0.08);
    }
    .account-meta {
      min-width: 0;
      padding-inline: 14px;
    }
    .account-meta:first-child {
      padding-right: 0;
      border-left: 0.5px solid rgba(255,255,255,0.08);
    }
    .account-meta:last-child {
      padding-left: 0;
    }
    .account-meta-label {
      display: block;
      margin-bottom: 4px;
      color: var(--text-tertiary);
      font-size: 10px;
      font-weight: 700;
    }
    .account-meta-value {
      display: block;
      color: #f5f5f7;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .last-online-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .last-online-dot {
      position: relative;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.38);
      flex-shrink: 0;
    }
    .last-online.online .last-online-dot {
      background: #37e66f;
      box-shadow: 0 0 10px rgba(55,230,111,0.62);
    }
    .last-online.online .last-online-dot::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid rgba(55,230,111,0.5);
      animation: online-ping 1.7s ease-out infinite;
    }
    @keyframes online-ping {
      from { transform: scale(0.55); opacity: 0.9; }
      to { transform: scale(1.55); opacity: 0; }
    }
    .last-online.online .last-online-text {
      color: #86efac;
    }
    .last-online-date {
      display: block;
      margin-top: 4px;
      color: var(--text-tertiary);
      font-size: 10px;
      font-weight: 600;
      direction: ltr;
      text-align: right;
    }
    @media (max-width: 350px) {
      .account-meta-row { grid-template-columns: 1fr; gap: 12px; }
      .account-meta { padding-inline: 0; }
      .account-meta:first-child { padding-bottom: 12px; border-left: 0; border-bottom: 0.5px solid rgba(255,255,255,0.08); }
    }
    .btn-sub-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 12px;
      border-radius: var(--r-pill);
      border: 0.5px solid rgba(255, 106, 0, 0.42);
      background: rgba(255, 106, 0, 0.18);
      color: #fed7aa;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.02em;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
      transition: transform 0.12s ease, filter 0.12s ease;
      -webkit-appearance: none;
      appearance: none;
    }
    .btn-sub-link svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .btn-sub-link:active { transform: scale(0.96); filter: brightness(0.94); }


    .usage-card {
      padding: var(--pad-y) var(--pad-x);
      margin-bottom: 12px;
    }
    .usage-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .usage-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .usage-total {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 27px;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      background: rgba(255,106,0,0.14);
      border: 0.5px solid rgba(255,106,0,0.26);
      color: #ffd0a0;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      direction: rtl;
      white-space: nowrap;
    }
    .usage-total small {
      color: rgba(255,255,255,0.55);
      font-size: 9px;
      font-weight: 700;
    }
    .usage-total-value { color: #ffd0a0; }
    .usage-ranges {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .usage-range {
      min-height: 32px;
      border: none;
      border-radius: var(--r-pill);
      background: var(--fill);
      border: 0.5px solid var(--glass-stroke-soft);
      color: var(--text-secondary);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.02em;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, transform 0.12s;
      -webkit-appearance: none;
      appearance: none;
    }
    .usage-range.active {
      background: rgba(255, 106, 0, 0.32);
      border-color: rgba(255, 106, 0, 0.4);
      color: #fff7ed;
    }
    .usage-range:active { transform: scale(0.97); }
    .usage-chart-wrap {
      position: relative;
      z-index: 1;
      min-height: 196px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.025));
      border: 0.5px solid var(--glass-stroke-soft);
      overflow: hidden;
    }
    .usage-line-chart {
      position: relative;
      min-height: 196px;
      padding: 12px 8px 9px;
      direction: ltr;
    }
    .usage-chart-stage {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: stretch;
      direction: ltr;
    }
    .usage-y-axis {
      position: relative;
      height: 150px;
      color: rgba(255,255,255,0.48);
      direction: ltr;
    }
    .usage-y-label {
      position: absolute;
      right: 4px;
      display: inline-flex;
      align-items: baseline;
      gap: 1px;
      transform: translateY(-50%);
      font-size: 8px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }
    .usage-y-label small {
      font-size: 6px;
      font-weight: 700;
      opacity: 0.7;
    }
    .usage-line-svg {
      display: block;
      width: 100%;
      height: 150px;
      overflow: visible;
    }
    .usage-line-grid {
      stroke: rgba(255,255,255,0.075);
      stroke-width: 1;
      stroke-dasharray: 4 6;
      vector-effect: non-scaling-stroke;
    }
    .usage-line-area {
      fill: url(#usage-area-gradient);
    }
    .usage-line-glow {
      fill: none;
      stroke: rgba(255,95,0,0.3);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: blur(5px);
      vector-effect: non-scaling-stroke;
    }
    .usage-line-path {
      fill: none;
      stroke: #ff7900;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter:
        drop-shadow(0 0 4px rgba(255,149,0,0.9))
        drop-shadow(0 0 10px rgba(255,95,0,0.5));
      vector-effect: non-scaling-stroke;
    }
    .usage-line-point-target { cursor: pointer; }
    .usage-line-hit { fill: transparent; }
    .usage-line-point {
      fill: #ffd0a0;
      stroke: #ff5f00;
      stroke-width: 2.2;
      filter: drop-shadow(0 0 5px rgba(255,106,0,0.9));
      vector-effect: non-scaling-stroke;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.16s ease, fill 0.16s ease;
    }
    .usage-line-point-target:hover .usage-line-point,
    .usage-line-point-target:focus .usage-line-point,
    .usage-line-point-target.active .usage-line-point {
      fill: #fff;
      transform: scale(1.45);
    }
    .usage-line-point-target:focus { outline: none; }
    .usage-point-tooltip {
      position: absolute;
      z-index: 4;
      min-width: 94px;
      padding: 7px 9px;
      border-radius: 11px;
      background: rgba(7,7,7,0.96);
      border: 0.5px solid rgba(255,106,0,0.5);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 14px rgba(255,95,0,0.18);
      color: #fff;
      direction: rtl;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.94);
      transform-origin: center;
      transition: opacity 0.14s ease, transform 0.14s ease;
    }
    .usage-point-tooltip.show {
      opacity: 1;
      transform: scale(1);
    }
    .usage-point-tooltip strong {
      display: block;
      color: #ffd0a0;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    .usage-point-tooltip span {
      display: block;
      margin-top: 2px;
      color: var(--text-secondary);
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
    }
    .usage-line-labels {
      display: grid;
      grid-template-columns: repeat(var(--point-count), minmax(0, 1fr));
      align-items: center;
      gap: 0;
      margin-top: 4px;
      margin-left: 30px;
      padding: 0 2px;
    }
    .usage-line-label {
      color: rgba(255,255,255,0.5);
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      direction: ltr;
    }
    .usage-line-labels.dense .usage-line-label {
      font-size: 7px;
      letter-spacing: -0.08em;
    }
    .usage-empty {
      min-height: 196px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .conn-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: var(--tap);
      padding: var(--pad-y) var(--pad-x);
      border-top: 0.5px solid var(--glass-stroke-soft);
    }
    .conn-row:first-child { border-top: none; }
    .conn-row .ico-svg {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      line-height: 0;
      background: var(--fill-thick);
      border: 0.5px solid var(--glass-stroke-soft);
    }
    .conn-row .ico-svg svg { width: 20px; height: 20px; display: block; }
    .conn-row .ico-svg.tint-blue { background: rgba(255, 106, 0, 0.34); color: #fdba74; }

  <script>

  var SVG_CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  var SVG_ANDROID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10h10v7a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-7z"/><path d="M8.5 10a3.5 3.5 0 0 1 7 0"/><path d="M8.5 6.5 7 4.5"/><path d="M15.5 6.5 17 4.5"/><path d="M10 14h.01"/><path d="M14 14h.01"/><path d="M5 12v4"/><path d="M19 12v4"/></svg>';
  var SVG_WINDOWS = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5h7v6H4V5zm9 0h7v6h-7V5zM4 13h7v6H4v-6zm9 0h7v6h-7v-6z"/></svg>';
  var SVG_LINUX = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-2.4 0-4 2.1-4 5.1 0 1.5-.5 2.8-1.3 4.1L5 15.4C4.3 16.8 5.2 18 6.6 18h10.8c1.4 0 2.3-1.2 1.6-2.6l-1.7-3.2C16.5 10.9 16 9.6 16 8.1 16 5.1 14.4 3 12 3z"/><path d="M9 19.5 7.8 21"/><path d="M15 19.5l1.2 1.5"/><path d="M10 8h.01"/><path d="M14 8h.01"/></svg>';
  var APP_PLATFORM_ORDER = ['ios', 'android', 'windows', 'macos', 'linux', 'appletv', 'androidtv', 'other'];

  function linkType(raw) {
    var low = raw.toLowerCase();
    if (low.indexOf('vless://') === 0) return 'vless';
    if (low.indexOf('vmess://') === 0) return 'vmess';
    if (low.indexOf('trojan://') === 0) return 'trojan';
    if (low.indexOf('wireguard://') === 0) return 'wireguard';
    if (low.indexOf('hysteria') === 0) return 'hysteria';
    if (low.indexOf('ss://') === 0 || low.indexOf('shadowsocks') === 0) return 'shadowsocks';
    return 'proxy';
  }

  function protocolSvg(type) {
    var map = {
      vless: 'tint-blue',
      vmess: 'tint-blue',
      trojan: 'tint-blue',
      wireguard: 'tint-blue',
      hysteria: 'tint-blue',
      shadowsocks: 'tint-blue',
      proxy: ''
    };

  }

  function copyBtnHtml() {

  }

  function qrBtnHtml() {

  function downloadBtnHtml() {

  }

  function actionBtnsHtml(canDownload) {
    return '<span class="row-actions">' + (canDownload ? downloadBtnHtml() : '') + qrBtnHtml() + copyBtnHtml() + '</span>';
  }

  var qrLibPromise = null;

  function loadQRCode() {
    if (window.QRCode) return Promise.resolve();
    if (qrLibPromise) return qrLibPromise;
    qrLibPromise = new Promise(function (resolve, reject) {
      var script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      script.async = true;
      script.onload = resolve;
      script.onerror = function () { reject(new Error('QR library failed to load')); };
      document.head.appendChild(script);
    });
    return qrLibPromise;
  }

  var qrModalText = '';

  function openQrModal(text, title, options) {
    if (!text) return;
    options = options || {};
    qrModalText = text;
    var modal = $('qr-modal');
    var canvas = $('qr-canvas');
    var linkRow = $('qr-link-row');
    $('qr-title').textContent = title || 'QR Code';
    canvas.innerHTML = '<span class="qr-loading">در حال ساخت QR</span>';

    if (options.showLink) {
      $('qr-link-text').textContent = text;
      $('qr-copy').innerHTML = SVG_COPY;
      linkRow.classList.remove('hidden');
    } else {
      $('qr-link-text').textContent = '';
      linkRow.classList.add('hidden');
    }

    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');

    loadQRCode().then(function () {
      canvas.innerHTML = '';
      try {
        new QRCode(canvas, {
          text: text,
          width: 220,
          height: 220,
          colorDark: '#0a0a0a',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      } catch (err) {
        closeQrModal();
        toast('لینک برای QR خیلی طولانی است');
      }
    }).catch(function () {
      closeQrModal();
      toast('خطا در ساخت QR');
    });

  function closeQrModal() {

    modal.classList.remove('show');

  function openSubscriptionLinkModal() {

      toast('لینک اشتراک آماده نیست');

  function setError(msg) {
    var box = $('error');
    if (!msg) { show(box, false); box.textContent = ''; return; }
    box.textContent = msg;
    show(box, true);
  }

  function showMain(options) {
    if (!options || !options.keepLoading) hideLoading();
    show($('login-card'), false);
    $('main').classList.add('visible');

  function showLogin() {

    $('main').classList.remove('visible');

  function showLoading() {
    show($('login-card'), false);
    show($('page-loading'), true);
  }

  function hideLoading() {
    show($('page-loading'), false);
  }

  function cacheKey(ctx) {
    var hash = 5381;
    for (var i = 0; i < ctx.subUrl.length; i++) {
      hash = ((hash << 5) + hash) ^ ctx.subUrl.charCodeAt(i);
    }
    return LS_PAGE_PREFIX + (hash >>> 0).toString(36);
  }

  function cleanupPageCache() {
    try {
      var now = Date.now();
      var items = [];
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var key = localStorage.key(i);
        if (!key || key.indexOf(LS_PAGE_PREFIX) !== 0) continue;
        var raw = localStorage.getItem(key);
        var savedAt = 0;
        try { savedAt = JSON.parse(raw || '{}').savedAt || 0; } catch (e) {}
        if (!savedAt || now - savedAt > CACHE_TTL_MS) {
          localStorage.removeItem(key);
        } else {
          items.push({ key: key, savedAt: savedAt });
        }
      }
      items.sort(function (a, b) { return b.savedAt - a.savedAt; });
      items.slice(CACHE_MAX_ENTRIES).forEach(function (item) {
        localStorage.removeItem(item.key);
      });
    } catch (e) {}
  }

  function readPageCache(ctx) {
    try {
      var raw = localStorage.getItem(cacheKey(ctx));
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || data.subUrl !== ctx.subUrl || !data.savedAt || Date.now() - data.savedAt > CACHE_TTL_MS) {
        localStorage.removeItem(cacheKey(ctx));
        return null;
      }
      return data;
    } catch (e) {
      return null;
    }
  }

  function writePageCache(ctx, data) {
    try {
      localStorage.setItem(cacheKey(ctx), JSON.stringify({
        savedAt: Date.now(),
        subUrl: ctx.subUrl,
        user: data.user,
        headers: data.headers || {},
        links: data.links || [],
        apps: data.apps || []
      }));
      cleanupPageCache();
    } catch (e) {}
  }

  function fetchWithTimeout(url, options, ms, message) {
    options = options || {};
    if (!window.AbortController) {
      return fetch(url, options);
    }
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, ms);
    options.signal = controller.signal;
    return fetch(url, options).then(function (res) {
      clearTimeout(timer);
      return res;
    }).catch(function (err) {
      clearTimeout(timer);
      if (err && err.name === 'AbortError') throw new Error(message || 'Request timeout');
      throw err;
    });
  }

  function renderPageData(ctx, data) {
    if (!data) return;
    if (data.user) renderUser(data.user);
    renderAnnounce(data.headers || {});
    renderConnections(ctx.subUrl, data.links || []);
    renderApps(data.apps || []);
  }

  function toPersianDigits(value) {
    return String(value).replace(/\d/g, function (digit) {
      return '۰۱۲۳۴۵۶۷۸۹'[digit];
    });
  }

  function formatBytes(n) {
    if (n == null || isNaN(n)) return '—';
    if (n === 0) return '۰ بایت';
    var u = ['بایت','کیلوبایت','مگابایت','گیگابایت','ترابایت'];
    var i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
    var value = (n / Math.pow(1024, i)).toFixed(i > 1 ? 1 : 0);
    return toPersianDigits(value).replace(/\./g, '٫') + ' ' + u[i];
  }

  function formatDate(v) {
    if (!v) return 'نامحدود';
    try {
      return new Date(v).toLocaleDateString('fa-IR', { month: 'short', day: 'numeric', year: 'numeric' });
    } catch (e) { return String(v); }
  }

  function formatDateTime(v) {
    var time = timestampFromValue(v);
    if (!time) return '';
    try {
      return new Intl.DateTimeFormat('fa-IR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(new Date(time));
    } catch (e) {
      return new Date(time).toLocaleString('fa-IR');
    }
  }

  function lastOnlineInfo(value) {
    var time = timestampFromValue(value);
    if (!time) return { text: 'هنوز متصل نشده', isOnline: false, time: null };
    var seconds = Math.abs(Math.floor((Date.now() - time) / 1000));
    if (seconds <= 60) return { text: 'آنلاین', isOnline: true, time: time };
    var amount;
    var unit;
    if (seconds >= 31536000) {
      amount = Math.floor(seconds / 31536000);
      unit = 'سال';
    } else if (seconds >= 2592000) {
      amount = Math.floor(seconds / 2592000);
      unit = 'ماه';
    } else if (seconds >= 86400) {
      amount = Math.floor(seconds / 86400);
      unit = 'روز';
    } else if (seconds >= 3600) {
      amount = Math.floor(seconds / 3600);
      unit = 'ساعت';
    } else if (seconds >= 60) {
      amount = Math.floor(seconds / 60);
      unit = 'دقیقه';
    } else {
      amount = seconds;
      unit = 'ثانیه';
    }
    return { text: toPersianDigits(amount) + ' ' + unit + ' پیش', isOnline: false, time: time };
  }

  function renderLastOnline(value) {
    var info = lastOnlineInfo(value);
    var target = $('f-online');
    target.className = 'account-meta-value last-online' + (info.isOnline ? ' online' : ' offline');
    target.innerHTML =
      '<span class="last-online-status"><span class="last-online-dot"></span>' +
      '<span class="last-online-text">' + escapeHtml(info.text) + '</span></span>' +
      (info.time ? '<span class="last-online-date">' + escapeHtml(formatDateTime(info.time)) + '</span>' : '');
  }

  function formatRemainingDays(value) {
    if (!value) return 'نامحدود';
    var end = timestampFromValue(value);
    if (!end) return formatDate(value);
    var remaining = end - Date.now();
    if (remaining <= 0) return 'تمام شده';
    return toPersianDigits(Math.ceil(remaining / 86400000)) + ' روز';
  }

  function formatDurationDays(ms) {
    if (!isFinite(ms) || ms <= 0) return '—';
    return toPersianDigits(Math.max(1, Math.ceil(ms / 86400000))) + ' روز';
  }

  function expireEndTimestamp(user, status) {
    if (status === 'on_hold' && user.on_hold_timeout) {
      return timestampFromValue(user.on_hold_timeout);
    }
    return timestampFromValue(user && user.expire);
  }

  function formatTotalDuration(user, status) {
    if (status === 'on_hold' && user.on_hold_expire_duration && !user.on_hold_timeout) {
      return formatDurationDays(Number(user.on_hold_expire_duration) * 1000);
    }
    var end = expireEndTimestamp(user, status);
    if (!end) return 'نامحدود';
    var start = timestampFromValue(user.created_at);
    if (!start || start >= end) return formatDate(end);
    return formatDurationDays(end - start);
  }

  function normalizeStatus(s) {
    if (!s) return 'active';
    if (typeof s === 'object' && s.name) return String(s.name).toLowerCase();
    return String(s).toLowerCase();
  }

  function cleanToken(value) {
    var token = String(value || '').trim().replace(/[\u200B-\u200D\uFEFF]/g, '');
    token = token.replace(/^['"]|['"]$/g, '');
    try { token = decodeURIComponent(token); } catch (e) {}
    return token.replace(/^\/+|\/+$/g, '');
  }

  function tokenFromUrlObject(u) {
    var keys = ['token', 'sub', 'sub_token', 'subscription', 'subscription_token'];
    for (var i = 0; i < keys.length; i++) {
      var found = u.searchParams.get(keys[i]);
      if (found) {
        var nested = parseTokenInput(found);
        if (nested && nested.token) return nested;
        return { token: cleanToken(found) };
      }
    }

    if (!/^https?:$/i.test(u.protocol)) return null;

    var subPath = u.pathname.replace(/\/+$/, '').replace(/\/(?:info|apps|links)$/i, '');
    var parts = subPath.split('/').filter(Boolean);
    var token = parts.length ? cleanToken(parts[parts.length - 1]) : '';
    if (!token || /\.(?:html?|php)$/i.test(token)) return null;

    return { token: token, subPath: subPath || ('/' + encodeURIComponent(token)) };
  }

  function parsePathInput(raw) {
    var path = String(raw || '').trim();
    if (path.charAt(0) !== '/') path = '/' + path;
    path = path.split(/[?#]/)[0].replace(/\/+$/, '').replace(/\/(?:info|apps|links)$/i, '');
    var parts = path.split('/').filter(Boolean);
    var token = parts.length ? cleanToken(parts[parts.length - 1]) : '';
    if (!token || /\.(?:html?|php)$/i.test(token)) return null;
    return { token: token, subPath: path };
  }

  function parseTokenInput(raw) {
    raw = (raw || '').trim().replace(/[\u200B-\u200D\uFEFF]/g, '');
    if (!raw) return null;

    try {
      if (/^[a-z][a-z0-9+.-]*:/i.test(raw)) {
        var u = new URL(raw);
        var parsedUrl = tokenFromUrlObject(u);
        if (parsedUrl && parsedUrl.token) {
          var panelParam = u.searchParams.get('panel') || u.searchParams.get('panel_url') || u.searchParams.get('base_url');
          var panel = parsedUrl.panel || panelParam || (/^https?:$/i.test(u.protocol) ? u.origin : '');
          return { panel: panel, token: parsedUrl.token, subPath: parsedUrl.subPath };
        }
        var hashParsed = parseTokenInput(u.hash.replace(/^#/, ''));
        if (hashParsed && hashParsed.token) {
          return { panel: hashParsed.panel || (/^https?:$/i.test(u.protocol) ? u.origin : ''), token: hashParsed.token, subPath: hashParsed.subPath };
        }
      }
    } catch (e) {}

    if (/^[^/?#\s]+\.[^/?#\s]+(?:[/?#].*)?$/i.test(raw)) {
      try {
        var looseUrl = new URL('https://' + raw);
        var looseParsed = tokenFromUrlObject(looseUrl);
        if (looseParsed && looseParsed.token) {
          return { panel: looseUrl.origin, token: looseParsed.token, subPath: looseParsed.subPath };
        }
      } catch (e) {}
    }

    var panelMatch = raw.match(/^(https?:\/\/[^/?#\s]+)/i);
    var pathMatch = raw.match(/(?:^|[/?#&\s])sub\/([^/?#&\s]+)/i);
    if (pathMatch) {
      var pathToken = cleanToken(pathMatch[1]);
      return {
        panel: panelMatch ? panelMatch[1] : undefined,
        token: pathToken,
        subPath: '/sub/' + encodeURIComponent(pathToken)
      };
    }

    var queryMatch = raw.match(/(?:^|[?&#])(?:token|sub|sub_token|subscription|subscription_token)=([^&#\s]+)/i);
    if (queryMatch) return { panel: panelMatch ? panelMatch[1] : undefined, token: cleanToken(queryMatch[1]) };

    if (raw.indexOf('/') > -1 && raw.indexOf('://') === -1 && !/\s/.test(raw)) {
      var pathParsed = parsePathInput(raw);
      if (pathParsed) return pathParsed;
    }

    if (!/\s/.test(raw) && raw.indexOf('://') === -1 && raw.indexOf('/') === -1 && raw.indexOf('?') === -1 && raw.indexOf('#') === -1) {
      return { token: cleanToken(raw) };
    }
    return null;
  }

  function resolveContext(panelInput, tokenInput) {
    var parsed = tokenInput && typeof tokenInput === 'object' ? tokenInput : parseTokenInput(tokenInput);
    if (!parsed) return null;
    var panel = (parsed.panel || panelInput || '').trim().replace(/\/+$/, '');
    if (panel && panel !== 'null' && !/^https?:\/\//i.test(panel)) panel = 'https://' + panel;
    if (!panel || panel === 'null') {
      var origin = window.location.origin;
      if (/^https?:\/\//i.test(origin)) panel = origin;
    }
    if (!panel || panel === 'null') return null;
    if (!parsed.token) return null;
    var subPath = parsed.subPath || ('/sub/' + encodeURIComponent(parsed.token));
    if (subPath.charAt(0) !== '/') subPath = '/' + subPath;
    subPath = subPath.replace(/\/+$/, '');
    return {
      panel: panel, token: parsed.token, subPath: subPath,
      subUrl: panel + subPath,
      infoUrl: panel + subPath + '/info',
      appsUrl: panel + subPath + '/apps',
      linksUrl: panel + subPath + '/links',
      usageUrl: panel + subPath + '/usage'
    };
  }

  function detectFromCurrentUrl() {
    var fromHref = parseTokenInput(window.location.href);
    if (fromHref && fromHref.token) return resolveContext(fromHref.panel || '', fromHref);

    var fromHash = parseTokenInput(window.location.hash.replace(/^#/, ''));
    if (fromHash && fromHash.token) return resolveContext(fromHash.panel || '', fromHash);

    return new Promise(function (resolve, reject) {

  function firstParam(params, keys) {

  function decodeUrlValue(value) {

  function decodeWireGuardPayload(raw) {

    if (payload.indexOf('[Interface]') >= 0) return payload;

    if (decoded && decoded.indexOf('[Interface]') >= 0) return decoded;
    return '';

  function wireGuardConf(raw) {
    raw = String(raw || '').trim();

    var decoded = decodeWireGuardPayload(raw);
    if (decoded) return decoded;

    try {
      var url = new URL(raw);
      var params = url.searchParams;
      var privateKey = normalizeWireGuardKey(decodeUrlValue(url.username || firstParam(params, ['privatekey', 'privateKey', 'private_key'])));
      var publicKey = normalizeWireGuardKey(firstParam(params, ['publickey', 'publicKey', 'public_key', 'peerpublickey', 'peerPublicKey', 'peer_public_key']));
      var endpoint = firstParam(params, ['endpoint']) || url.host;
      var address = firstParam(params, ['address', 'addresses', 'localaddress', 'localAddress', 'local_address', 'ip']);
      var dns = firstParam(params, ['dns', 'dnsserver', 'dnsServer', 'dns_server']);
      var mtu = firstParam(params, ['mtu']);
      var presharedKey = normalizeWireGuardKey(firstParam(params, ['presharedkey', 'preSharedKey', 'preshared_key', 'psk']));
      var allowedIps = firstParam(params, ['allowedips', 'allowedIPs', 'allowed_ips']) || '0.0.0.0/0, ::/0';
      var keepalive = firstParam(params, ['persistentkeepalive', 'persistentKeepalive', 'persistent_keepalive', 'keepalive']) || '25';
      var lines = ['[Interface]'];

      if (privateKey) lines.push('PrivateKey = ' + privateKey);
      if (address) lines.push('Address = ' + address);
      if (dns) lines.push('DNS = ' + dns);
      if (mtu) lines.push('MTU = ' + mtu);
      lines.push('', '[Peer]');
      if (publicKey) lines.push('PublicKey = ' + publicKey);
      if (presharedKey) lines.push('PresharedKey = ' + presharedKey);
      if (allowedIps) lines.push('AllowedIPs = ' + allowedIps);

  function usageRangeUrl(ctx, range) {
    var meta = USAGE_RANGES[range] || USAGE_RANGES['1d'];
    var end = new Date();
    var start = new Date(end.getTime() - (meta.hours ? meta.hours * 3600000 : meta.days * 86400000));
    return ctx.usageUrl +
      '?period=' + encodeURIComponent(meta.period) +
      '&start=' + encodeURIComponent(start.toISOString()) +

  function fetchUsage(ctx, range) {
    return fetchWithTimeout(usageRangeUrl(ctx, range), { credentials: 'same-origin', headers: { Accept: 'application/json' } }, 7000, 'Usage timeout')
      .then(function (res) { return res.ok ? res.json() : null; })

  function normalizeUsage(data) {
    var stats = data && data.stats;
    var points = {};
    function add(item) {
      if (!item || !item.period_start) return;
      var value = Number(item.total_traffic || 0);
      if (!isFinite(value)) value = 0;
      points[item.period_start] = (points[item.period_start] || 0) + value;
    }
    if (Array.isArray(stats)) {
      stats.forEach(add);
    } else if (stats && typeof stats === 'object') {
      Object.keys(stats).forEach(function (key) {
        var list = stats[key];
        if (Array.isArray(list)) list.forEach(add);
      });
    }
    return Object.keys(points).sort().map(function (time) {
      return { time: time, value: points[time] };

  function usagePad(value) {

  function tehranDateParts(date) {
    if (!(date instanceof Date) || isNaN(date.getTime())) return null;
    try {
      var parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Tehran',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        hourCycle: 'h23'

      var out = {};
      parts.forEach(function (part) {
        if (part.type !== 'literal') out[part.type] = parseInt(part.value, 10);
      });
      if (out.hour === 24) out.hour = 0;
      return out;
    } catch (e) {
      return {
        year: date.getFullYear(),
        month: date.getMonth() + 1,
        day: date.getDate(),
        hour: date.getHours()

    }
  }

  function usagePeriodKey(time, range) {
    var parts = tehranDateParts(new Date(time));

    return range === '1d' ? key + '-' + usagePad(parts.hour) : key;
  }

  function usageWallKey(wallTime, range) {
    var date = new Date(wallTime);
    var key = date.getUTCFullYear() + '-' + usagePad(date.getUTCMonth() + 1) + '-' + usagePad(date.getUTCDate());
    return range === '1d' ? key + '-' + usagePad(date.getUTCHours()) : key;
  }

  function usageWallIso(wallTime, range) {
    var date = new Date(wallTime);

  }

  function buildUsageBuckets(items, range) {
    var meta = USAGE_RANGES[range] || USAGE_RANGES['1d'];
    var nowParts = tehranDateParts(new Date());
    var anchor = Date.UTC(nowParts.year, nowParts.month - 1, nowParts.day, range === '1d' ? nowParts.hour : 0, 0, 0, 0);
    var totals = {};
    var actualTimes = {};
    items.forEach(function (item) {
      var key = usagePeriodKey(item.time, range);
      if (!key) return;
      totals[key] = (totals[key] || 0) + (Number(item.value) || 0);
      if (!actualTimes[key]) actualTimes[key] = item.time;

        value: totals[key] || 0

  function tehranHourLabel(time) {

        timeZone: 'Asia/Tehran',

  }

  function tehranMonthDayLabel(time) {

  function usageXAxisLabel(range, bucket, index, count) {

  }

  function formatUsageTooltipDate(time) {
    var date = new Date(time);
    if (isNaN(date.getTime())) return '';
    try {
      return new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
        timeZone: 'Asia/Tehran',
        calendar: 'persian',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
      }).format(date);

      return date.toLocaleString('fa-IR');

  function formatUsageValue(value) {
    if (!value) return '۰G';

    var amount = gb;
    var unit = 'G';
    if (gb >= 1024) {
      amount = gb / 1024;
      unit = 'T';
    } else if (gb < 0.1) {
      amount = value / 1048576;
      unit = 'M';
    }
    var text = amount < 1 ? amount.toFixed(2) : (amount < 10 ? amount.toFixed(1) : String(Math.round(amount)));
    text = text.replace(/\.0$/, '');
    return toPersianDigits(text) + unit;
  }

  function chartNumber(value) {
    return Math.round(value * 10) / 10;
  }

  function usageSmoothPath(points) {
    if (!points.length) return '';
    var path = 'M ' + points[0].x + ' ' + points[0].y;
    if (points.length === 1) return path;
    for (var i = 0; i < points.length - 1; i++) {
      var p0 = points[i - 1] || points[i];
      var p1 = points[i];
      var p2 = points[i + 1];
      var p3 = points[i + 2] || p2;
      var cp1x = chartNumber(p1.x + (p2.x - p0.x) / 6);
      var cp1y = chartNumber(p1.y + (p2.y - p0.y) / 6);
      var cp2x = chartNumber(p2.x - (p3.x - p1.x) / 6);
      var cp2y = chartNumber(p2.y - (p3.y - p1.y) / 6);
      path += ' C ' + cp1x + ' ' + cp1y + ', ' + cp2x + ' ' + cp2y + ', ' + p2.x + ' ' + p2.y;
    }
    return path;
  }

  function renderUsageChart(items, range) {
    var chart = $('usage-chart');
    var meta = USAGE_RANGES[range] || USAGE_RANGES['1d'];
    var buckets = buildUsageBuckets(items, range);
    var max = Math.max.apply(null, buckets.map(function (p) { return p.value; })) || 1;
    var total = buckets.reduce(function (sum, p) { return sum + p.value; }, 0);
    var gigabyte = 1073741824;
    var axisMaxGb = Math.max(5, Math.ceil(max / gigabyte / 5) * 5);
    var axisMax = axisMaxGb * gigabyte;
    var width = 320;
    var height = 132;
    var padX = 12;
    var padTop = 12;
    var baseY = 120;
    var plotHeight = baseY - padTop;
    var points = buckets.map(function (bucket, idx) {
      var x = buckets.length === 1 ? width / 2 : padX + idx * (width - padX * 2) / (buckets.length - 1);
      var y = baseY - (bucket.value / axisMax) * plotHeight;
      return { x: chartNumber(x), y: chartNumber(y), value: bucket.value, time: bucket.time };
    });
    var linePath = usageSmoothPath(points);
    var areaPath = linePath + ' L ' + points[points.length - 1].x + ' ' + baseY +
      ' L ' + points[0].x + ' ' + baseY + ' Z';
    var grid = '';
    var yLabels = '';
    for (var tickGb = 0; tickGb <= axisMaxGb; tickGb += 5) {

    $('usage-total').textContent = formatBytes(total);
    chart.innerHTML = '<div class="usage-line-chart">' +
      '<div class="usage-chart-stage">' +
        '<div class="usage-y-axis" aria-hidden="true">' + yLabels + '</div>' +
        '<svg class="usage-line-svg" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none" role="img" aria-label="نمودار خطی مصرف">' +
          '<defs><linearGradient id="usage-area-gradient" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="#ff7900" stop-opacity="0.42"></stop>' +
            '<stop offset="65%" stop-color="#ff5f00" stop-opacity="0.12"></stop>' +
            '<stop offset="100%" stop-color="#ff5f00" stop-opacity="0"></stop>' +
          '</linearGradient></defs>' +
          grid +
          '<path class="usage-line-area" d="' + areaPath + '"></path>' +
          '<path class="usage-line-glow" d="' + linePath + '"></path>' +

      '</div>' +
      '<div class="usage-line-labels' + (range === '1d' ? ' dense' : '') + '" style="--point-count:' + buckets.length + '">' + labels + '</div>' +
      '<div class="usage-point-tooltip" aria-hidden="true"><strong></strong><span></span></div>' +
    '</div>';

    var tooltip = chart.querySelector('.usage-point-tooltip');
    var svg = chart.querySelector('.usage-line-svg');
    var pointElements = chart.querySelectorAll('.usage-line-point-target');
    function hidePointTooltip() {
      tooltip.classList.remove('show');
      tooltip.setAttribute('aria-hidden', 'true');
      pointElements.forEach(function (node) { node.classList.remove('active'); });
    }
    function showPointTooltip(node) {
      var value = Number(node.getAttribute('data-value')) || 0;
      var label = node.getAttribute('data-label') || '';
      pointElements.forEach(function (item) { item.classList.toggle('active', item === node); });
      tooltip.querySelector('strong').textContent = formatBytes(value);
      tooltip.querySelector('span').textContent = label;

      var host = tooltip.parentElement;
      var hostRect = host.getBoundingClientRect();
      var pointRect = node.getBoundingClientRect();
      var hostWidth = host.clientWidth;
      var hostHeight = host.clientHeight;
      var pointX = pointRect.left + pointRect.width / 2 - hostRect.left;
      var pointY = pointRect.top + pointRect.height / 2 - hostRect.top;
      var tooltipWidth = tooltip.offsetWidth || 100;
      var tooltipHeight = tooltip.offsetHeight || 48;
      var maxLeft = Math.max(6, hostWidth - tooltipWidth - 6);
      var left = Math.min(maxLeft, Math.max(6, pointX - tooltipWidth / 2));
      var top = pointY - tooltipHeight - 10;

      var maxTop = Math.max(6, hostHeight - tooltipHeight - 6);

  function renderUsageLoading(range) {

  function loadUsage(range) {
    if (!usageCtx) return;

    document.querySelectorAll('.usage-range').forEach(function (btn) {
      var active = btn.getAttribute('data-range') === usageRange;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', active ? 'true' : 'false');

        $('usage-chart').innerHTML = '<div class="usage-empty">دریافت آمار مصرف ممکن نشد</div>';
        return;

  function configDisplayName(raw) {

    if (raw.toLowerCase().indexOf('vmess://') === 0) {
      try {
        var vmessJson = decodeBase64Utf8(raw.slice(8));
        var vmess = JSON.parse(vmessJson);
        if (vmess && vmess.ps) return safeDecode(vmess.ps).trim();
      } catch (e) {}
    }

    try {
      var url = new URL(raw);
      var hashName = safeDecode(url.hash.replace(/^#/, '')).trim();
      if (hashName) return hashName;

      var params = url.searchParams;
      var paramName = params.get('name') || params.get('remark') || params.get('remarks') || params.get('tag');
      if (paramName) return safeDecode(paramName).trim();
    } catch (e) {}

    var hashIndex = raw.indexOf('#');
    if (hashIndex >= 0) {
      return safeDecode(raw.slice(hashIndex + 1)).trim();
    }

    return '';
  }

  function linkLabel(raw) {
    var low = raw.toLowerCase();
    if (low.indexOf('vless://') === 0) return 'VLESS';
    if (low.indexOf('vmess://') === 0) return 'VMess';
    if (low.indexOf('trojan://') === 0) return 'Trojan';
    if (low.indexOf('wireguard://') === 0) return 'WireGuard';
    if (low.indexOf('hysteria') === 0) return 'Hysteria';
    if (low.indexOf('ss://') === 0 || low.indexOf('shadowsocks') === 0) return 'Shadowsocks';
    return 'Proxy';
  }

  function timestampFromValue(value) {
    if (value == null || value === '' || value === false) return null;
    var n = Number(value);
    if (isFinite(n) && String(value).trim() !== '') {
      if (n <= 0) return null;
      if (n < 100000000000) n *= 1000;
      return n;
    }
    var normalized = String(value).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(normalized)) {
      normalized += 'T00:00:00Z';
    } else if (/^\d{4}-\d{2}-\d{2}[T\s]/.test(normalized) && !/(?:Z|[+-]\d{2}:?\d{2})$/i.test(normalized)) {
      normalized = normalized.replace(' ', 'T') + 'Z';
    }
    var time = new Date(normalized).getTime();
    return isFinite(time) && time > 0 ? time : null;
  }


  function renderUser(user) {
    var status = normalizeStatus(user.status);
    var labels = { active:'فعال', disabled:'غیرفعال', limited:'محدود', expired:'منقضی', on_hold:'معلق' };
    var name = user.full_name || user.name || user.username || '—';
    $('f-username').textContent = name;
    document.title = name && name !== '—' ? name : 'اشتراک';

    var pill = $('f-status');
    pill.textContent = labels[status] || status;
    pill.className = 'status-pill ' + status;

    var used = user.used_traffic || 0;
    var limit = user.data_limit;
    var remain = !limit ? null : Math.max(0, (Number(limit) || 0) - (Number(used) || 0));
    $('f-limit').textContent = !limit ? '∞' : formatBytes(limit);
    $('f-remain').textContent = !limit ? '∞' : formatBytes(remain);
    updateAccountUsage(used, limit);

    if (status === 'on_hold' && user.on_hold_timeout) {
      $('f-expire').textContent = formatRemainingDays(user.on_hold_timeout);
    } else if (status === 'on_hold' && user.on_hold_expire_duration) {
      var days = Math.floor(user.on_hold_expire_duration / 86400);
      $('f-expire').textContent = toPersianDigits(days) + ' روز';
    } else {
      $('f-expire').textContent = formatRemainingDays(user.expire);
    }
    renderLastOnline(user.online_at);
  }

  function renderAnnounce(headers) {
    var msg = decodeAnnounce(headers.announce);
    var url = headers['announce-url'];
    var box = $('announce');
    if (!msg && !url) { show(box, false); return; }
    var html = msg ? '<div class="announce-line"><span class="announce-dot" aria-hidden="true"></span><span class="announce-text">' + escapeHtml(msg) + '</span></div>' : '';
    if (url) html += '<p class="announce-link"><a href="' + escapeAttr(url) + '" target="_blank" rel="noopener">جزئیات</a></p>';
    box.innerHTML = html;
    show(box, true);
  }

  var storedLinks = [];
  var storedSubUrl = '';

  function renderConnections(subUrl, links) {
    storedSubUrl = subUrl;
    storedLinks = links || [];
    var html = '';

    html += '<div class="conn-row" data-copy="sub">' +
      '<span class="ico-svg tint-green">' + SVG_LINK + '</span>' +
      '<span class="body"><span class="title">لینک اشتراک</span>' +
      '<span class="sub">' + escapeHtml(subUrl) + '</span></span>' +
      actionBtnsHtml() + '</div>';

    if (storedLinks.length > 1) {
      html += '<div class="conn-row" data-copy="all">' +
        '<span class="ico-svg tint-yellow">' + SVG_STACK + '</span>' +
        '<span class="body"><span class="title">کپی همه کانفیگ‌ها</span>' +
        '<span class="sub">' + storedLinks.length + ' مورد</span></span>' +
        copyBtnHtml() + '</div>';
    }

    storedLinks.forEach(function (raw, idx) {
      var label = linkLabel(raw);
      var name = configDisplayName(raw);
      var title = name || (label + ' · ' + (idx + 1));
      var preview = raw.length > 44 ? raw.slice(0, 44) + '…' : raw;
      var type = linkType(raw);
      var proto = protocolSvg(type);
      html += '<div class="conn-row" data-copy="link" data-idx="' + idx + '">' +
        '<span class="ico-svg ' + proto.tint + '">' + proto.svg + '</span>' +
        '<span class="body"><span class="title">' + escapeHtml(title) + '</span>' +
        '<span class="sub">' + escapeHtml((name ? label + ' · ' : '') + preview) + '</span></span>' +
        actionBtnsHtml(type === 'wireguard') + '</div>';
    });

    $('connections-list').innerHTML = html;

    $('connections-list').querySelectorAll('.conn-row').forEach(function (row) {
      var btn = row.querySelector('.btn-copy');
      var qrBtn = row.querySelector('.btn-qr');
      var downloadBtn = row.querySelector('.btn-download');

      function rowPayload() {
        var kind = row.getAttribute('data-copy');
        if (kind === 'sub') return { text: storedSubUrl, title: 'لینک اشتراک' };
        if (kind === 'all') return { text: storedLinks.join('\n'), title: 'همه کانفیگ‌ها' };
        var i = parseInt(row.getAttribute('data-idx'), 10);
        var raw = storedLinks[i] || '';
        return { text: raw, title: configDisplayName(raw) || linkLabel(raw) };
      }

      if (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          copyText(rowPayload().text, btn);
        });
      }
      if (qrBtn) {
        qrBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var payload = rowPayload();
          openQrModal(payload.text, payload.title);
        });
      }
      if (downloadBtn) {
        downloadBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var payload = rowPayload();
          downloadWireGuardConfig(payload.text, payload.title);
        });
      }
    });
  }

  function platformTagClass(platform) {
    var p = canonicalPlatform(platform);
    if (p === 'android' || p === 'androidtv') return 'tag-green';
    if (p === 'ios' || p === 'macos' || p === 'appletv') return 'tag-light';
    if (p === 'windows') return 'tag-blue';
    return 'tag-blue';
  }

  function canonicalPlatform(platform) {
    var p = String(platform || 'other').toLowerCase().replace(/[\s_-]+/g, '');
    if (!p || p === 'undefined' || p === 'null') return 'other';
    if (p === 'iphone' || p === 'ipad' || p === 'ipados') return 'ios';
    if (p === 'mac' || p === 'macosx' || p === 'macintosh') return 'macos';
    if (p === 'win' || p === 'win32' || p === 'win64') return 'windows';
    if (p === 'appletvos' || p === 'tvos') return 'appletv';
    if (p === 'googletv' || p === 'firetv') return 'androidtv';
    return p;
  }

  function detectOS() {
    var ua = (navigator.userAgent || '').toLowerCase();
    var platform = (navigator.platform || '').toLowerCase();
    var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var userAgentData = navigator.userAgentData;

    if (userAgentData && userAgentData.platform) {
      var uaPlatform = userAgentData.platform.toLowerCase();
      if (uaPlatform.indexOf('tvos') > -1 || uaPlatform.indexOf('apple tv') > -1) return 'appletv';
      if (uaPlatform.indexOf('android') > -1) {
        return /android tv|google tv|googletv|fire tv|firetv/.test(ua) ? 'androidtv' : 'android';
      }
      if (uaPlatform.indexOf('ios') > -1 || uaPlatform === 'iphone' || uaPlatform === 'ipad') return 'ios';
      if (uaPlatform.indexOf('windows') > -1) return 'windows';
      if (uaPlatform.indexOf('mac') > -1) return 'macos';
      if (uaPlatform.indexOf('linux') > -1) return 'linux';
    }

    if (/tvos|apple tv|appletv/.test(ua)) return 'appletv';
    if (/android tv|google tv|googletv|fire tv|firetv/.test(ua)) return 'androidtv';
    if (/iphone|ipad|ipod/.test(ua) || (platform === 'macintel' && 'ontouchend' in document)) return 'ios';
    if (/android/.test(ua) || platform.indexOf('android') > -1) return 'android';
    if (isTouch && (platform.indexOf('linux') > -1 || /linux/.test(ua))) {
      if (/mobile|tablet|phone/.test(ua) || window.innerWidth <= 768) return 'android';
    }
    if (/windows|win32|win64/.test(ua) || platform.indexOf('win') > -1) return 'windows';
    if (/macintosh|mac os x|macos/.test(ua) || platform.indexOf('mac') > -1) return 'macos';
    if (/linux/.test(ua) || platform.indexOf('linux') > -1) return 'linux';
    return 'unknown';
  }

  function mapOSToPlatform(os) {
    return os === 'unknown' ? 'other' : canonicalPlatform(os);
  }

  function platformLabel(platform) {
    var labels = {
      ios: 'iOS',
      android: 'Android',
      windows: 'Windows',
      macos: 'macOS',
      linux: 'Linux',
      appletv: 'Apple TV',
      androidtv: 'Android TV',
      other: 'سایر'
    };
    return labels[platform] || platform;
  }

  function platformIcon(platform) {
    if (platform === 'ios' || platform === 'macos' || platform === 'appletv') return SVG_APPLE;
    if (platform === 'android' || platform === 'androidtv') return SVG_ANDROID;
    if (platform === 'windows') return SVG_WINDOWS;
    if (platform === 'linux') return SVG_LINUX;
    return SVG_NETWORK;
  }

  function isPersianLang(value) {
    var lang = String(value || '').trim().toLowerCase().replace(/_/g, '-');
    return lang === 'fa' || lang === 'fa-ir' || lang === 'persian' || lang === 'farsi';
  }

  function appDescription(app) {
    var desc = app && app.description;
    if (!desc) return '';
    if (typeof desc === 'string') return desc;
    return desc.fa || desc.FA || desc['fa-IR'] || desc['fa_IR'] || '';
  }

  function persianDownloadLinks(app) {
    var dlList = app && app.download_links ? app.download_links : [];
    return dlList.filter(function (d) {
      if (!d || !d.url) return false;
      var lang = d.language != null ? d.language : d.lang;
      if (lang == null || String(lang).trim() === '') return true;
      return isPersianLang(lang);
    });
  }

  function firstAppIconValue(app) {
    var keys = ['icon', 'icon_url', 'image', 'image_url', 'logo', 'logo_url', 'thumbnail', 'thumbnail_url', 'picture', 'picture_url'];
    for (var i = 0; i < keys.length; i++) {
      var value = app && app[keys[i]];
      if (typeof value === 'string' && value.trim()) return value.trim();
      if (value && typeof value === 'object') {
        var nested = value.url || value.src || value.path;
        if (typeof nested === 'string' && nested.trim()) return nested.trim();
      }
    }
    return '';
  }

  function appIconUrl(app) {
    var raw = firstAppIconValue(app);
    if (!raw) return '';
    if (/^data:image\//i.test(raw) || /^blob:/i.test(raw) || /^https?:\/\//i.test(raw)) return raw;
    if (raw.indexOf('//') === 0) return window.location.protocol + raw;
    if (/^[a-z][a-z0-9+.-]*:/i.test(raw)) return '';

    var base = (usageCtx && usageCtx.panel) || window.location.origin || window.location.href;
    try {
      return new URL(raw, base.replace(/\/+$/, '') + '/').href;
    } catch (e) {
      return raw;
    }
  }

  function appIconHtml(app) {
    var src = appIconUrl(app);
    var fallback = '<span class="app-icon-fallback" aria-hidden="true">' + platformIcon(canonicalPlatform(app && app.platform)) + '</span>';
    if (!src) return '<span class="app-icon">' + fallback + '</span>';
    return '<span class="app-icon"><img src="' + escapeAttr(src) + '" alt="' + escapeAttr((app && app.name) || 'اپلیکیشن') + '" loading="lazy" onerror="this.remove();">' + fallback + '</span>';
  }

  function appCardHtml(app) {
    var dlList = persianDownloadLinks(app);
    var desc = appDescription(app);
    var icon = appIconHtml(app);
    var dls = dlList.map(function (d) {
      return '<a class="dl" href="' + escapeAttr(d.url) + '" target="_blank" rel="noopener">' +
        escapeHtml(d.name || 'دانلود') + '</a>';
    }).join('');
    var imp = app.import_url
      ? '<a class="im" href="' + escapeAttr(app.import_url) + '" target="_blank" rel="noopener">افزودن اشتراک</a>'
      : '';
    var dlCount = Math.min(dlList.length, 2);
    return '<div class="app-card">' +
      '<div class="app-top">' + icon +
      '<div class="app-info"><div class="app-head"><span class="app-title-line"><span class="app-name">' + escapeHtml(app.name) +
      '</span>' + (app.recommended ? '<span class="app-tag tag-orange">پیشنهادی</span>' : '') + '</span>' +
      (app.platform ? '<span class="app-tag ' + platformTagClass(app.platform) + '"><span class="platform-tag-label">' + escapeHtml(app.platform) + '</span></span>' : '') +
      '</div>' +
      (desc ? '<div class="app-desc">' + escapeHtml(desc) + '</div>' : '') +
      '</div></div>' +
      '<div class="app-btns" data-dl-count="' + dlCount + '">' + dls + imp + '</div></div>';
  }

  function groupAppsByPlatform(apps) {
    var groups = {};
    apps.forEach(function (app) {
      var key = canonicalPlatform(app.platform);
      if (!groups[key]) groups[key] = [];
      groups[key].push(app);
    });
    return groups;
  }

  function orderedPlatformKeys(groups, currentPlatform) {
    var preferred = currentPlatform && groups[currentPlatform]
      ? [currentPlatform].concat(APP_PLATFORM_ORDER.filter(function (p) { return p !== currentPlatform; }))
      : APP_PLATFORM_ORDER.slice();
    var ordered = preferred.filter(function (p) { return groups[p] && groups[p].length; });
    Object.keys(groups).sort().forEach(function (p) {
      if (ordered.indexOf(p) === -1) ordered.push(p);
    });
    return ordered;
  }

  function setAppsTabVisible(hasApps) {
    var shell = $('content-tabs');
    var wasConfigsOnly = shell.classList.contains('configs-only');
    shell.classList.toggle('configs-only', !hasApps);
    if (!hasApps) {
      $('apps-list').innerHTML = '';
      setActiveTab('configs');
    } else if (wasConfigsOnly) {
      setActiveTab('apps');
    }
  }

  function renderApps(apps) {
    if (!apps || !apps.length) {
      setAppsTabVisible(false);
      return;
    }
    setAppsTabVisible(true);

    var detectedOS = detectOS();
    var currentPlatform = detectedOS === 'unknown' ? '' : mapOSToPlatform(detectedOS);
    var groups = groupAppsByPlatform(apps);
    var keys = orderedPlatformKeys(groups, currentPlatform);
    var defaultOpen = groups[currentPlatform] ? currentPlatform : keys[0];

    $('apps-list').innerHTML = '<div class="platform-list">' + keys.map(function (key) {
      var isCurrent = key === currentPlatform && !!groups[currentPlatform];
      var isOpen = key === defaultOpen;
      var appCount = groups[key].length;
      return '<section class="platform-accordion' + (isOpen ? ' open' : '') + (isCurrent ? ' current' : '') + '" data-platform="' + escapeAttr(key) + '">' +
        '<button type="button" class="platform-toggle" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
          '<span class="platform-icon ' + platformTagClass(key) + '">' + platformIcon(key) + '</span>' +
          '<span class="platform-main">' +
            '<span class="platform-title-row">' +
              '<span class="platform-title">' + escapeHtml(platformLabel(key)) + '</span>' +
              (isCurrent ? '<span class="platform-current">سیستم عامل شما</span>' : '') +
            '</span>' +
            '<span class="platform-count">' + toPersianDigits(appCount) + ' اپلیکیشن</span>' +
          '</span>' +
          '<span class="platform-chev">' + SVG_CHEV + '</span>' +
        '</button>' +
        '<div class="platform-content">' +
          groups[key].map(appCardHtml).join('') +
        '</div>' +
      '</section>';
    }).join('') + '</div>';

    $('apps-list').querySelectorAll('.platform-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var item = btn.closest('.platform-accordion');
        var willOpen = !item.classList.contains('open');
        $('apps-list').querySelectorAll('.platform-accordion').forEach(function (other) {
          other.classList.remove('open');
          var otherBtn = other.querySelector('.platform-toggle');
          if (otherBtn) otherBtn.setAttribute('aria-expanded', 'false');
        });
        if (willOpen) {
          item.classList.add('open');
          btn.setAttribute('aria-expanded', 'true');
        }
      });
    });

    $('apps-list').querySelectorAll('.app-btns a').forEach(function (link) {
      link.addEventListener('click', function () {
        toast(link.classList.contains('im') ? 'در حال افزودن' : 'در حال دانلود');
        flashCopy(link);
      });
    });
  }

  function setActiveTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      var isActive = btn.getAttribute('data-tab') === tab;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });

    $('apps-panel').classList.toggle('active', tab === 'apps');
    $('configs-panel').classList.toggle('active', tab === 'configs');
  }

  function loadAll(ctx) {
    setError('');
    usageCtx = ctx;
    usageRange = '1d';
    renderUsageLoading();
    loadUsage(usageRange);
    var cached = readPageCache(ctx);
    var hasCache = cached && cached.user;

    if (hasCache) {
      renderPageData(ctx, cached);
    } else {
      renderConnections(ctx.subUrl, []);
      renderApps([]);
      renderAnnounce({});
    }

    if (hasCache) {
      showMain();
    } else {
      showMain({ keepLoading: true });
      showLoading();
    }

    var pageData = {
      user: hasCache ? cached.user : null,
      headers: hasCache ? (cached.headers || {}) : {},
      links: hasCache ? (cached.links || []) : [],
      apps: hasCache ? (cached.apps || []) : []
    };
    var infoError = null;

    var infoPromise = fetchInfo(ctx)
      .then(function (infoResult) {
        pageData.user = infoResult.data;
        pageData.headers = infoResult.headers || {};
        renderUser(pageData.user);
        renderAnnounce(pageData.headers);
        localStorage.setItem(LS_PANEL, ctx.panel);
        localStorage.setItem(LS_TOKEN, ctx.subUrl);
        hideLoading();
        showMain();
      })
      .catch(function (err) {
        infoError = err;
        hideLoading();
        if (!hasCache) {
          $('main').classList.remove('visible');
          showLogin();
          var msg = (infoError && infoError.message) || 'خطا در دریافت اطلاعات';
          if (window.location.protocol === 'file:') {
            msg += ' — فایل را روی همان دامنه پنل میزبانی کنید.';
          }
          setError(msg);
        }
      });

    var linksPromise = fetchLinks(ctx)
      .then(function (links) {
        pageData.links = links || [];
        renderConnections(ctx.subUrl, pageData.links);
      })
      .catch(function () { return []; });

    var appsPromise = fetchApps(ctx)
      .then(function (apps) {
        pageData.apps = apps || [];
        renderApps(pageData.apps);
      })
      .catch(function () { return []; });

    Promise.all([infoPromise, linksPromise, appsPromise])
      .then(function () {
        if (pageData.user) {
          writePageCache(ctx, pageData);
        }
      });
  }

  function startFromForm() {
    var ctx = resolveContext($('panel-url').value, $('sub-token').value);
    if (!ctx) { setError('لینک یا توکن معتبر نیست.'); return; }
    loadAll(ctx);
  }

  $('btn-load').addEventListener('click', startFromForm);
  $('sub-token').addEventListener('keydown', function (e) { if (e.key === 'Enter') startFromForm(); });
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setActiveTab(btn.getAttribute('data-tab'));
    });
  });
  document.querySelectorAll('.usage-range').forEach(function (btn) {
    btn.addEventListener('click', function () {
      loadUsage(btn.getAttribute('data-range'));
    });
  });
  $('btn-sub-link').innerHTML = SVG_QR + '<span>لینک اشتراک</span>';
  $('btn-sub-link').addEventListener('click', openSubscriptionLinkModal);
  $('qr-copy').innerHTML = SVG_COPY;
  $('qr-copy').addEventListener('click', function () {
    if (!qrModalText) return;
    copyText(qrModalText, $('qr-copy'));
  });
  $('qr-close').addEventListener('click', closeQrModal);
  $('qr-modal').addEventListener('click', function (e) {
    if (e.target === $('qr-modal')) closeQrModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('qr-modal').classList.contains('show')) closeQrModal();
  });

  (function init() {
    cleanupPageCache();
    var savedPanel = localStorage.getItem(LS_PANEL);
    var savedToken = localStorage.getItem(LS_TOKEN);
    if (savedPanel) $('panel-url').value = savedPanel;
    if (savedToken) $('sub-token').value = savedToken;

    var auto = detectFromCurrentUrl();
    if (auto) {
      $('panel-url').value = auto.panel;
      $('sub-token').value = auto.subUrl;
      loadAll(auto);
      return;
    }
    if (savedPanel && savedToken) {
      var ctx = resolveContext(savedPanel, savedToken);
      if (ctx) {
        loadAll(ctx);
        return;
      }
    }
    showLogin();
  })();
})();
  </script>
